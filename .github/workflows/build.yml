name: Test block effects and build plugin

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test block effect handling
    runs-on: ubuntu-24.04
    steps:
      - name: Check out EffectBlock-HiroTeam source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned Axolotl-PM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
          path: .test-dependencies/axolotl-pm
          persist-credentials: false
      - name: Set up Axolotl-PM PHP environment
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: "8.1"
          pm-version-major: "5"
          install-path: ./.php-bin
      - name: Install pinned Axolotl-PM dependencies
        run: composer install --working-dir=.test-dependencies/axolotl-pm --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Test block effect behavior
        run: php tests/block-effect.php .test-dependencies/axolotl-pm

  build:
    needs: test
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@v2 # v1.0.15
    with:
      axolotl-ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
      phpstan: max
